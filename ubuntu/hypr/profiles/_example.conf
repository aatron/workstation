# Example profile — copy to ~/.config/hypr/local-profiles/<name>.conf and edit.
# Files starting with "_" are templates and are never selected. Real monitor
# descriptions (they contain serial numbers) belong only in local-profiles/,
# which is not part of this repo.
#
# Monitors are matched by description, not connector name: `hyprctl monitors`
# prints it, and it stays the same when cables or docks change the DP-n names.
# `hypr-profile --auto` picks the profile whose desc: lines are all connected.
#
# Role variables: the common files refer to monitors by role, never by name.
# Every profile defines the same roles. Declare each monitor as `$role = desc:...`
# on its own line.
$left  = desc:Vendor Model SerialLeft
$right = desc:Vendor Model SerialRight

monitor = $left,  preferred, 0x0,    auto
monitor = $right, preferred, 2560x0, auto
# Anything else that gets plugged in
monitor = , preferred, auto, auto
