# Hyprland config — symlinked to ~/.config/hypr/hyprland.conf by install.sh.
# Based on the example shipped with Hyprland 0.53 (/usr/share/hypr/hyprland.conf);
# changes from it are marked "# ours".
#
# Layout (see profiles/README.md):
#   profile.conf   -> profiles/<name>.conf: this machine's monitors and the role
#                     variables ($left, $right, ...). Sourced FIRST so the common
#                     files can use the variables. Switch with `hypr-profile <name>`.
#   common/*.conf  -> behavior shared by every machine.

source = ~/.config/hypr/profile.conf   # ours
source = ~/.config/hypr/env.conf   # ours: PATH with ~/.local/bin, generated by setup_hyprland


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ~/.local/bin/kitty   # ours
$fileManager = nautilus   # ours
$menu = fuzzel   # ours


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = nm-applet   # ours
exec-once = waybar   # ours
exec-once = mako   # ours
exec-once = ~/.local/bin/hypr-profile --auto   # ours
exec-once = hyprpaper   # ours
exec-once = wl-paste --watch cliphist store   # ours
exec-once = systemctl --user start hyprpolkitagent   # ours


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


source = ~/.config/hypr/common/look.conf   # ours
source = ~/.config/hypr/common/input.conf   # ours
source = ~/.config/hypr/common/binds.conf   # ours
source = ~/.config/hypr/common/windowrules.conf   # ours


###############
### COLORS  ###
###############

# Border colors, written by wallust (run `theme <name>`). Sourced after look.conf
# so they override its border colors.
source = ~/.config/hypr/colors.conf   # ours
