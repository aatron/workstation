# Rendered by wallust to ~/.config/hypr/colors.conf (sourced by hyprland.conf).
# The focused window gets a Tron Legacy orange gradient on every theme. Orange is
# the complement of the cyan/teal used everywhere else (wallpaper, Waybar), so
# the active window stands out; unfocused borders are the scheme's grey, dimmed.
general {
    col.active_border = rgb(df740c) rgb(ffa63d) 45deg
    col.inactive_border = rgba({{ color0 | strip }}55)
}
