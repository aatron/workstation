# wallust 3.5 config — symlinked to ~/.config/wallust/wallust.toml by install.sh.
# `theme <name>` runs `wallust cs <name>`, which renders every template below
# from theme/colorschemes/<name>.json. Targets are absolute; ~ is expanded.

[templates]
kitty    = { template = 'kitty.conf',    target = '~/.config/kitty/colors.conf' }
waybar   = { template = 'waybar.css',    target = '~/.config/waybar/colors.css' }
hyprland = { template = 'hyprland.conf', target = '~/.config/hypr/colors.conf' }
fuzzel   = { template = 'fuzzel.ini',    target = '~/.config/fuzzel/fuzzel.ini' }
mako     = { template = 'mako',          target = '~/.config/mako/config' }
zed      = { template = 'zed.json',      target = '~/.config/zed/themes/wallust.json' }
