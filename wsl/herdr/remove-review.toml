# Review cleanup launcher.
# Installed by install.sh into herdr-plus quick-actions/.
# Opens a real herdr tab so gum can multi-select reviews and confirm.
#
# Interactive: pick one or more review/<id> folders to remove now (open PRs do
# not block). Scheduled scan remains: review-remove.sh --yes (no picker).
# Azure DevOps is read but never written. See review-remove.sh.
name = "Review - Delete"
description = "Pick local reviews to remove now (multi-select)"
type = "command"
command = '"$HOME/bin/worktree-launch.sh" remove-review {{.WorkspaceId}} "{{.WorkDir}}"'
